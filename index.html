<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mirrrrr</title>
<style>
:root{color-scheme:light;--bg:#fff;--card:#fff;--ink:#222;--sub:#777;--line:#ddd;--pink:#333;--pink2:#eee;--err:#d6264f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:1.5rem;margin:8px 0 4px}
.lead{color:var(--sub);font-size:.9rem;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card.bad{border-color:var(--err);box-shadow:0 0 0 2px color-mix(in srgb,var(--err) 25%,transparent)}
.q{font-weight:700;font-size:1.02rem}
.q i{color:var(--err);font-style:normal;margin-left:4px}
.d{color:var(--sub);font-size:.85rem;margin:2px 0 10px}
textarea,input[type=text]{width:100%;font:inherit;font-size:.95rem;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--line);padding:8px 2px;resize:vertical;outline:none;border-radius:0}
textarea:focus,input[type=text]:focus{border-color:var(--pink)}
.opt{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:.95rem;cursor:pointer}
.opt input{width:20px;height:20px;accent-color:var(--pink)}
.addp input{display:none}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.th{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th button{position:absolute;top:2px;right:2px;width:22px;height:22px;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1}
.err{color:var(--err);font-size:.82rem;margin-top:6px;display:none}
.card.bad .err{display:block}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--pink);color:#fff;font:inherit;font-weight:700;font-size:1rem;cursor:pointer;margin-top:6px}
.btn.ghost{background:transparent;color:var(--pink);border:1.5px solid var(--pink)}
.btn:focus-visible,.addp:focus-within{outline:3px solid var(--pink2);outline-offset:2px}
/* receipt */
.guide{background:var(--pink2);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:.9rem;margin-bottom:18px}
.rc{--paper:#fffefb;position:relative;background:var(--paper);color:#2b2226;padding:26px 20px 30px;margin:0 4px 26px;font-family:"Courier New","Malgun Gothic","Apple SD Gothic Neo",monospace;font-size:.88rem;box-shadow:0 2px 14px rgba(0,0,0,.15)}
.rc::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(135deg,var(--paper) 25%,transparent 25%) -8px 0,linear-gradient(225deg,var(--paper) 25%,transparent 25%) -8px 0;background-size:16px 16px}
.rc h2{text-align:center;margin:0;font-size:1.25rem;letter-spacing:.08em}
.rc .c{text-align:center;color:#7a6870;font-size:.8rem}
.hr{border:0;border-top:1.5px dashed #b9a5ad;margin:14px 0}
.row{display:flex;justify-content:space-between;gap:10px}
.it{margin-bottom:14px}
.it b{display:block}
.it .v{white-space:pre-wrap;word-break:break-word;margin-top:3px}
.it .v.e{color:#a69099}
.ph{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:6px}
.ph img{width:100%;border:1px solid #e0d3d8;display:block}
.tot{font-weight:700;font-size:1rem}
.bar{height:34px;margin-top:16px;background:repeating-linear-gradient(90deg,#2b2226 0 2px,transparent 2px 5px,#2b2226 5px 6px,transparent 6px 10px,#2b2226 10px 13px,transparent 13px 15px)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">

<div id="formView">
  <h1>커미션 신청서</h1>
  <p class="lead">필수사항을 기재하면 영수증을 제작할 수 있어요! 완성된 신청서를 이미지로 저장(또는 캡쳐)해서 보내주세요~! >w<</p>
  <div id="fields"></div>
  <button class="btn" id="make">영수증 프린트!</button>
</div>

<div id="receiptView" hidden>
  <div class="guide">📸 영수증 맨 아래의 <b>이미지로 저장</b> 버튼을 눌러 저장한 뒤 보내주세요. 저장이 안 되면 화면에 뜨는 이미지를 길게 눌러 저장하거나 캡쳐해서 보내주시면 됩니다!</div>
  <div class="rc" id="rc"></div>
  <button class="btn" id="save">📥 이미지로 저장 (PNG)</button>
  <button class="btn ghost" id="back" style="margin-top:10px">← 수정하기</button>
</div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
var FIELDS=[
{id:'name',t:'신청자 닉네임',d:'신청하실 커미션 플랫폼 닉네임을 기재해주세요.',req:1,type:'line'},
{id:1,t:'1. 캐릭터 외관',d:'(1번 캐릭터 / 2번 캐릭터 등의 텍스트 or 사진 - 자리 번호 꼭 기재해주세요!!)',req:1,type:'text',photo:1},
{id:2,t:'2. 캐릭터 의상',d:'(외관 의상과 다르다면 이곳에 첨부 or 기재해주세요.)',type:'text',photo:1},
{id:3,t:'3. 대사/자막 변경',d:'(원하시는 문구를 적어주세요! 대사는 A와 B의 말풍선, 자막은 샘플 하단의 노란 자막입니다!)',req:1,type:'text'},
{id:4,t:'4. 표정 변경',d:'(샘플처럼 or 텍스트 설명 or 참고 자료)',type:'text',photo:1},
{id:5,t:'5. 포즈 변경 (+15,000 P)',d:'(변경이 필요할 시 기재해주세요! 길거나 움직임이 많은 포즈는 추가금+n 혹은 거절 될 수 있습니다!) - 필요 없을 시 꼭~~!!! 비워주세요!',type:'text',photo:1},
{id:6,t:'6. 보정 색감',d:'(기본 색상은 핑크 입니다.)',type:'text'},
{id:7,t:'7. 샘플 공개 여부',req:1,type:'check',opts:['공개','비공개 (+ 5,000)']},
{id:8,t:'8. 슬롯 마감 시 안내사항',d:'(신청서가 들어온 순서대로 작업이 시작 됩니다! 앞서 받은 커미션이 완료되면 다음 분께 결제 요청을 드리는 식입니다.)',type:'radio',opts:['글쿤','네']}
];
var photos={};
var $=function(s){return document.querySelector(s)};
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

function build(){
  var box=$('#fields');
  FIELDS.forEach(function(f){
    var c=el('div','card');c.id='c'+f.id;
    var q=el('div','q',f.t);if(f.req){q.appendChild(el('i',null,'*'))}
    c.appendChild(q);
    if(f.d)c.appendChild(el('div','d',f.d));
    if(f.type==='line'){var i=document.createElement('input');i.type='text';i.id='f'+f.id;i.placeholder='내 답변';c.appendChild(i)}
    if(f.type==='text'){var t=document.createElement('textarea');t.id='f'+f.id;t.rows=2;t.placeholder='내 답변';c.appendChild(t)}
    if(f.type==='check'||f.type==='radio'){
      f.opts.forEach(function(o){
        var l=el('label','opt');var i=document.createElement('input');
        i.type=f.type==='check'?'checkbox':'radio';i.name='f'+f.id;i.value=o;
        l.appendChild(i);l.appendChild(el('span',null,o));c.appendChild(l);
      });
    }
    if(f.photo){
      photos[f.id]=[];
      var lab=el('label','addp','📷 사진 첨부');
      var inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.multiple=true;
      inp.onchange=function(){addPhotos(f.id,inp.files);inp.value=''};
      lab.appendChild(inp);c.appendChild(lab);
      var th=el('div','thumbs');th.id='t'+f.id;c.appendChild(th);
    }
    c.appendChild(el('div','err',f.type==='check'?'하나 이상 선택해주세요.':'필수 항목이에요.'));
    box.appendChild(c);
  });
}

function shrink(file,cb){
  var r=new FileReader();
  r.onload=function(){
    var im=new Image();
    im.onload=function(){
      var m=900,s=Math.min(1,m/Math.max(im.width,im.height));
      var cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      cb(cv.toDataURL('image/jpeg',.85));
    };
    im.src=r.result;
  };
  r.readAsDataURL(file);
}
function addPhotos(id,files){
  Array.prototype.forEach.call(files,function(f){shrink(f,function(u){photos[id].push(u);drawThumbs(id)})});
}
function drawThumbs(id){
  var box=$('#t'+id);box.textContent='';
  photos[id].forEach(function(u,i){
    var d=el('div','th');var im=new Image();im.src=u;d.appendChild(im);
    var b=el('button',null,'×');b.type='button';b.setAttribute('aria-label','사진 삭제');
    b.onclick=function(){photos[id].splice(i,1);drawThumbs(id)};
    d.appendChild(b);box.appendChild(d);
  });
}
function val(f){
  if(f.type==='line'||f.type==='text')return $('#f'+f.id).value.trim();
  var n=document.querySelectorAll('input[name="f'+f.id+'"]:checked'),a=[];
  n.forEach(function(x){a.push(x.value)});return a;
}
function money(n){return n.toLocaleString('ko-KR')}

$('#make').onclick=function(){
  var bad=null;
  FIELDS.forEach(function(f){
    var v=val(f),ok=true;
    if(f.req){
      if(f.type==='check')ok=v.length>0;
      else{ok=v.length>0||(f.photo&&photos[f.id].length>0)}
    }
    $('#c'+f.id).classList.toggle('bad',!ok);
    if(!ok&&!bad)bad=$('#c'+f.id);
  });
  if(bad){bad.scrollIntoView({behavior:'smooth',block:'center'});return}
  receipt();
  $('#formView').hidden=true;$('#receiptView').hidden=false;window.scrollTo(0,0);
};
$('#back').onclick=function(){$('#receiptView').hidden=true;$('#formView').hidden=false;window.scrollTo(0,0)};

function receipt(){
  var rc=$('#rc');rc.textContent='';
  var now=new Date();
  var ds=now.getFullYear()+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  rc.appendChild(el('h2',null,'Mirr COMMISSION'));
  rc.appendChild(el('div','c','커미션 신청 영수증'));
  rc.appendChild(el('hr','hr'));
  var r1=el('div','row');r1.appendChild(el('span',null,'신청일시'));r1.appendChild(el('span',null,ds));rc.appendChild(r1);
  var r2=el('div','row');r2.appendChild(el('span',null,'신청자'));r2.appendChild(el('b',null,$('#fname').value.trim()));rc.appendChild(r2);
  rc.appendChild(el('hr','hr'));
  var extra=[];
  FIELDS.forEach(function(f){
    if(f.id==='name')return;
    var it=el('div','it');it.appendChild(el('b',null,f.t));
    var v=val(f),txt=Array.isArray(v)?v.join(', '):v;
    var has=txt.length>0;
    var vv=el('div','v'+(has?'':' e'),has?txt:'-');it.appendChild(vv);
    if(f.photo&&photos[f.id].length){
      var g=el('div','ph');
      photos[f.id].forEach(function(u){var im=new Image();im.src=u;g.appendChild(im)});
      it.appendChild(g);has=true;
    }
    if(f.id===5&&has)extra.push(['포즈 변경',15000]);
    if(f.id===7&&Array.isArray(v)&&v.some(function(x){return x.indexOf('비공개')>-1}))extra.push(['샘플 비공개',5000]);
    rc.appendChild(it);
  });
  rc.appendChild(el('hr','hr'));
  var sum=0;
  extra.forEach(function(e){
    sum+=e[1];
    var r=el('div','row');r.appendChild(el('span',null,e[0]));r.appendChild(el('span',null,'+'+money(e[1])+' P'));rc.appendChild(r);
  });
  if(!extra.length)rc.appendChild(el('div','c','추가금 항목 없음'));
  var t=el('div','row tot');t.appendChild(el('span',null,'추가금 합계'));t.appendChild(el('span',null,money(sum)+' P'));
  t.style.marginTop='8px';rc.appendChild(t);
  rc.appendChild(el('div','c','※ 기본 금액 별도 / 작업 난이도에 따라 추가금이 변동 될 수 있습니다.')).style.marginTop='8px';
  rc.appendChild(el('hr','hr'));
  rc.appendChild(el('div','bar'));
  rc.appendChild(el('div','c','THANK YOU ♡')).style.marginTop='10px';
}
build();
var dl=null;
function showImg(url){
  var o=el('div');o.style.cssText='position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.88);overflow:auto;padding:16px;text-align:center';
  var p=el('p',null,'이미지를 길게 눌러(PC는 우클릭) 저장하세요');p.style.cssText='color:#fff;margin:6px 0 12px';
  var im=new Image();im.src=url;im.style.cssText='max-width:100%;border-radius:4px';
  var x=el('button','btn','닫기');x.style.cssText='max-width:240px;margin:14px auto 30px;display:block';
  x.onclick=function(){o.remove()};
  o.appendChild(p);o.appendChild(im);o.appendChild(x);document.body.appendChild(o);
}
$('#save').onclick=function(){
  var b=$('#save'),t='📥 이미지로 저장 (PNG)';
  if(!window.html2canvas){alert('이미지 도구를 불러오지 못했어요. 화면을 캡쳐해주세요.');return}
  var rc=$('#rc');b.disabled=true;b.textContent='이미지 만드는 중...';
  html2canvas(rc,{scale:2,backgroundColor:'#ffffff',height:rc.offsetHeight+12,useCORS:true}).then(function(cv){
    var url=cv.toDataURL('image/png');
    cv.toBlob(function(blob){
      var nm=$('#fname').value.trim().replace(/[\\\/:*?"<>|]/g,'');
      var done=function(){b.disabled=false;b.textContent=t};
      if(!dl){showImg(url);done();return}
      dl.save({filename:'커미션신청서_'+nm+'.png',data:blob}).catch(function(e){if(e&&e.code!=='declined')showImg(url)}).then(done);
    },'image/png');
  }).catch(function(){b.disabled=false;b.textContent=t;alert('이미지 생성에 실패했어요. 화면을 캡쳐해주세요.')});
};
try{window.claude&&claude.use('downloads').then(function(d){dl=d;if(d)$('#save').hidden=false}).catch(function(){})}catch(e){}
$('#save').onclickOld=function(){
  var b=$('#save');
  if(!dl||!window.html2canvas){alert('이 환경에서는 저장이 안 돼요. 화면을 캡쳐해주세요.');return}
  var rc=$('#rc');b.disabled=true;b.textContent='이미지 만드는 중...';
  html2canvas(rc,{scale:2,backgroundColor:'#fdf0f4',height:rc.offsetHeight+12,useCORS:true}).then(function(cv){
    cv.toBlob(function(blob){
      var nm=$('#fname').value.trim().replace(/[\\\/:*?"<>|]/g,'');
      dl.save({filename:'커미션신청서_'+nm+'.png',data:blob}).catch(function(e){
        if(e&&e.code!=='declined')alert('저장에 실패했어요. 화면을 캡쳐해주세요.');
      }).then(function(){b.disabled=false;b.textContent='📥 이미지로 저장 (PNG)'});
    },'image/png');
  }).catch(function(){b.disabled=false;b.textContent='📥 이미지로 저장 (PNG)';alert('이미지 생성에 실패했어요. 화면을 캡쳐해주세요.')});
};
</script>
</body>
</html>
